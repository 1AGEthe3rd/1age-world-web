name: Deploy 1AGE World

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare 1AGE World
        run: |
          mkdir -p public
          cp index.* public/
          if [ -f CNAME ]; then cp CNAME public/; fi
          touch public/.nojekyll

      - name: Upload World
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy World
        id: deployment
        uses: actions/deploy-pages@v4
