name: Import tested 1AGE World Build 045 (one-time)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-world-build045.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download pinned and validated World Build 045
        env:
          BUILD_URL: "https://sdmntprcentralus.oaiusercontent.com/files/00000000-3374-81f5-8a1e-0b1a009f471d/raw?se=2026-11-23T17%3A34%3A48Z&sp=r&sv=2026-06-06&sr=b&scid=bbc9e966-0b8f-59c8-80d8-047164d12d41&skoid=3c9b86d7-60cb-496a-a3c1-90c5457c8da4&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-23T03%3A09%3A08Z&ske=2026-11-24T03%3A09%3A08Z&sks=b&skv=2026-06-06&sig=DKgzrxf7W55CWPKUtc869Zh5H8hso3qvglIPWed0JQ0%3D"
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --location --retry 3 --max-time 120 "$BUILD_URL" -o /tmp/build045.zip
          mkdir -p /tmp/world045
          unzip -q /tmp/build045.zip -d /tmp/world045
          cd /tmp/world045
          sed 's@  preview/@  @' SHA256SUMS.txt | sha256sum -c -
          test -s index.html
          test -s index.js
          test -s index.pck
          test -s index.wasm
          grep -q "fe78677eb7a7568f7553a0971679a0319e66fbdd" SOURCE.txt
      - name: Commit matching verified browser bundle
        shell: bash
        run: |
          set -euo pipefail
          for f in /tmp/world045/index.*; do
            test -f "$f" && cp "$f" .
          done
          printf '1age.world\n' > CNAME
          touch .nojekyll
          git config user.name "1AGE Build Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add index.* CNAME .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Publish World Build 045: clean holograms and touch-first immersive entrance"
            git push origin HEAD:main
          fi
