name: Verify adaptive World pack
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release pack and matching loader
        run: |
          test "$(wc -c < index.pck)" = "13455324"
          echo '534774429a50ebdd4d316af91c6da67f92bfb118720430e7f7fab4b01b03d204  index.pck' | sha256sum --check
          grep -F '"index.pck":13455324' index.html
