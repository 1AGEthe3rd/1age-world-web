name: Verify World Build 010A pack
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release pack and matching loader
        run: |
          test "$(wc -c < index.pck)" = "13471060"
          echo '640d882bfe154beaa7a7a66bf66e08babde47d7ec13c0c92e802320d5922a4f2  index.pck' | sha256sum --check
          grep -F '"index.pck":13471060' index.html
      - name: Prepare Cloudflare-compatible static output
        run: node scripts/build-cloudflare.mjs
      - name: Verify restored engine and original project pack
        run: node scripts/test-cloudflare-build.mjs
