name: Verify World Build 010 pack
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release pack and matching loader
        run: |
          test "$(wc -c < index.pck)" = "13466052"
          echo '21d9844132e57db7edfc56aac03469c273e09245328cce34f03955b0c8af24c2  index.pck' | sha256sum --check
          grep -F '"index.pck":13466052' index.html
      - name: Prepare Cloudflare-compatible static output
        run: node scripts/build-cloudflare.mjs
      - name: Verify restored engine and original project pack
        run: node scripts/test-cloudflare-build.mjs
