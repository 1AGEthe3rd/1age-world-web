name: Stage 1AGE World solar + outer-ring release (no live deploy)
on:
  push:
    branches:
      - publish/solar-outer-ring-20261123
    paths:
      - .github/workflows/stage-world-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve validated matching Godot web export
        shell: bash
        env:
          ARTIFACT_URL: "https://sdmntprwestus3.oaiusercontent.com/files/00000000-c7ac-81fd-bd09-9e4c3bffaf40/raw?se=2026-11-23T22%3A54%3A49Z&sp=r&sv=2026-06-06&sr=b&scid=b5789ed9-67aa-582d-89b2-a2add1470af3&skoid=1a0ef048-201c-43e0-8950-52d58956a71a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-23T03%3A02%3A07Z&ske=2026-11-24T03%3A02%3A07Z&sks=b&skv=2026-06-06&sig=gXyplkRqrvI6MKC3un4ubum0hb9OiYiL4ktMq18WUcM%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 20 "$ARTIFACT_URL" -o /tmp/world-release.zip
          echo "1fcf2969af222674fab3e230fadb187f650724f4a563e36f9b191764a4a4b8dd  /tmp/world-release.zip" | sha256sum -c -
          mkdir -p /tmp/world-release
          unzip -q /tmp/world-release.zip -d /tmp/world-release
          echo "07da9833103fd9a003ec77dbdd4c932bc869cb8df0cb8ba9d755153479d5b2fa  /tmp/world-release/index.pck" | sha256sum -c -
          cmp /tmp/world-release/index.js index.js
          cmp /tmp/world-release/index.wasm index.wasm
          test "$(wc -c </tmp/world-release/index.pck)" -eq 621184
          cat /tmp/world-release/SOURCE.txt
      - name: Retain original World loading art and domain; stage new scene only
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/world-release/index.pck index.pck
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          contents=p.read_text()
          old='"index.pck":619040'
          assert contents.count(old)==1, "Live loader size was unexpectedly modified"
          contents=contents.replace(old,'"index.pck":621184')
          assert "1AGE-EARTH-LOADING-001" in contents
          assert "1AGE-GREEN-PROGRESS-001" in contents
          p.write_text(contents)
          assert Path("CNAME").read_text().strip()=="1age.world"
          Path("WORLD_RELEASE.txt").write_text(
             "1AGE World: Sun-centered seven-planet orbital system, ordinary Moon, ten flat outer platforms, logo menu.\n"
             "Development source: 1AGEthe3rd/1age-world@f5fe98f8669809c0d303da00d0c349d1ac8b6d89\n"
             "Source workflow run: https://github.com/1AGEthe3rd/1age-world/actions/runs/45283146333\n"
             "Previous live release backup: backup/pre-solar-outer-ring-release-20261123\n"
             "Godot 4.7.2 matching JS/WASM retained and original Earth loading screen preserved.\n"
          )
          PY
      - name: Browser screenshot on staged bundle (desktop and touch)
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.56.1
          mkdir -p release-screenshots
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/site.log 2>&1 &
          for count in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break || sleep 1; done
          node <<'NODE'
          const { chromium } = require('playwright');
          (async ()=>{
            const browser = await chromium.launch({
              executablePath:'/usr/bin/google-chrome',
              headless:true,
              args:['--no-sandbox','--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']
            });
            let failed=false;
            for(const cfg of [
              {name:'world-desktop',viewport:{width:1366,height:768},touch:false},
              {name:'world-mobile',viewport:{width:390,height:844},touch:true}
            ]){
              const context=await browser.newContext({
                viewport:cfg.viewport,
                isMobile:cfg.touch,
                hasTouch:cfg.touch,
                deviceScaleFactor:1
              });
              const page=await context.newPage();
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              page.on('console',m=>{if(m.type()==='error') errors.push(m.text())});
              try {
                await page.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded',timeout:30000});
                await page.waitForTimeout(10000);
                const status=await page.locator('#status').count();
                const notice=status ? await page.locator('#status-notice').textContent().catch(()=> '') : '';
                const loading=status ? await page.locator('#status').evaluate(e=>getComputedStyle(e).visibility==='visible').catch(()=>true) : false;
                const canvas=await page.locator('canvas').count();
                await page.screenshot({path:'release-screenshots/'+cfg.name+'.png',timeout:30000});
                console.log(cfg.name,'canvas',canvas,'loading',loading,'notice',notice,'errors',errors.slice(0,3));
                if(!canvas || (loading && notice?.trim())) failed=true;
              } catch(e) { console.error(cfg.name,e.message); failed=true; }
              await context.close();
            }
            await browser.close();
            if(failed)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit compiled preview to staging branch; do not touch main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index.pck WORLD_RELEASE.txt
          git commit -m "Stage validated solar-system World build with protected loader"
          git push origin HEAD:publish/solar-outer-ring-20261123
      - name: Preserve staging screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solar-world-publish-visual-review
          path: release-screenshots/
          retention-days: 7
          if-no-files-found: warn
