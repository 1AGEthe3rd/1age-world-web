name: Import tested 1AGE World Build 044 (one-time)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-world-build043.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download pinned reviewed Godot 4.7.2 export
        env:
          BUILD_URL: "https://sdmntprcentralus.oaiusercontent.com/files/00000000-9fc8-81f5-8912-75e086ad4d6d/raw?se=2026-11-23T17%3A22%3A11Z&sp=r&sv=2026-06-06&sr=b&scid=bb49c40e-4c7b-57a1-b06d-9c8d06969805&skoid=3c9b86d7-60cb-496a-a3c1-90c5457c8da4&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-23T00%3A46%3A17Z&ske=2026-11-24T00%3A46%3A17Z&sks=b&skv=2026-06-06&sig=OiWNiE28fVxtfr4HpROpJxSRvak7niIfn6rjemIxZzc%3D"
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --location --retry 3 --max-time 120 "$BUILD_URL" -o /tmp/build044.zip
          unzip -q /tmp/build044.zip -d /tmp/build044
          cd /tmp/build044
          sed 's@  preview/@  @' SHA256SUMS.txt | sha256sum -c -
          test -s index.html
          test -s index.js
          test -s index.pck
          test -s index.wasm
          grep -q "e303e2d8d3f8536f682ae72c44d39719489ec883" SOURCE.txt
      - name: Replace complete public World Web bundle and preserve domain
        shell: bash
        run: |
          set -euo pipefail
          for f in /tmp/build044/index.*; do
            test -f "$f" && cp "$f" .
          done
          printf '1age.world\n' > CNAME
          touch .nojekyll
          git config user.name "1AGE Build Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add index.* CNAME .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Publish tested World Build 044: app hologram portals and original ring overlay"
            git push origin HEAD:main
          fi
