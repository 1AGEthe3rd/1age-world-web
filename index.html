const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":13466052,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	
<script>
(() => {
    "use strict";

    const canvas = document.getElementById("oneage-earth-canvas");
    if (!canvas) return;

    const context = canvas.getContext("2d");
    if (!context) return;

    const strip = document.createElement("canvas");
    const stripContext = strip.getContext("2d");
    if (!stripContext) return;

    const image = new Image();
    const tiles = [];

    // Original 1AGE spherical Earth projection.
    for (let row = 0; row < 32; row++) {
        const top = -1 + row / 16;
        const bottom = -1 + (row + 1) / 16;

        const limit = Math.sqrt(
            Math.max(0, 1 - ((top + bottom) / 2) ** 2)
        );

        const v1 = 0.5 + Math.asin(top) / Math.PI;
        const v2 = 0.5 + Math.asin(bottom) / Math.PI;

        for (let column = 0; column < 24; column++) {
            const a = -Math.PI / 2 + column * Math.PI / 24;
            const b = -Math.PI / 2 + (column + 1) * Math.PI / 24;

            tiles.push({
                left: limit * Math.sin(a),
                right: limit * Math.sin(b),
                top,
                bottom,
                u: 1 + a / (Math.PI * 2),
                du: (b - a) / (Math.PI * 2),
                v: v1,
                dv: v2 - v1
            });
        }
    }

    function render(turn) {
        context.clearRect(0, 0, 336, 336);

        context.save();
        context.beginPath();
        context.arc(168, 168, 168, 0, Math.PI * 2);
        context.clip();

        context.fillStyle = "#000";
        context.fillRect(0, 0, 336, 336);

        for (const tile of tiles) {
            context.drawImage(
                strip,
                (tile.u + turn) * image.width,
                tile.v * image.height,
                tile.du * image.width,
                tile.dv * image.height,
                (1 + tile.left) * 168 - 0.3,
                (1 + tile.top) * 168 - 0.3,
                (tile.right - tile.left) * 168 + 0.6,
                (tile.bottom - tile.top) * 168 + 0.6
            );
        }

        context.restore();
    }

    image.onload = () => {
        strip.width = image.width * 3;
        strip.height = image.height;

        for (let i = 0; i < 3; i++) {
            stripContext.drawImage(
                image,
                i * image.width,
                0
            );
        }

        const reduced = window.matchMedia(
            "(prefers-reduced-motion: reduce)"
        );

        const started = performance.now();

        render(0);

        const timer = window.setInterval(() => {
            // Godot removes its status overlay when World starts.
            if (!canvas.isConnected) {
                window.clearInterval(timer);
                return;
            }

            if (document.hidden || reduced.matches) return;

            const elapsed = (performance.now() - started) / 1000;
            const turn = (elapsed / 120) % 1;

            render(turn);
        }, 100);
    };

    image.onerror = () => {
        console.warn("1AGE World Earth texture unavailable.");
    };

    image.src = "world-surface.png";
})();
</script>
